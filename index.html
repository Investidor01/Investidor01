<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Info Dantas Brasil</title>
<style>
  :root {
    --bg-light: #f3f4f6;
    --bg-dark: #121212;
    --text-light: #000;
    --text-dark: #fff;
    --blue: #2563eb;
  }
  body {
    margin:0; font-family: Arial, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-light);
    transition: background-color 0.3s, color 0.3s;
  }
  body.dark {
    background-color: var(--bg-dark);
    color: var(--text-dark);
  }
  header {
    background-color: var(--blue);
    color: white;
    padding: 1em;
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  header h1 {
    margin:0; font-size:1.4em;
  }
  button {
    cursor:pointer;
    background: white;
    border:none;
    border-radius: 4px;
    padding: 0.4em 0.8em;
    font-weight: bold;
    color: var(--blue);
  }
  .login-form input {
    margin-right: 0.5em;
    padding: 0.3em;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  main {
    max-width: 800px;
    margin: 1em auto;
    padding: 0 1em;
  }
  section {
    margin-bottom: 2em;
  }
  h2 {
    border-bottom: 2px solid var(--blue);
    padding-bottom: 0.3em;
  }
  .weather-item {
    background: white;
    border-radius: 6px;
    padding: 1em;
    margin-bottom: 0.8em;
    display: flex;
    align-items: center;
    gap: 1em;
    color: black;
  }
  body.dark .weather-item {
    background: #222;
    color: white;
  }
  .weather-item img {
    width: 50px;
    height: 50px;
  }
  .news-item {
    background: white;
    border-radius: 6px;
    padding: 1em;
    margin-bottom: 1em;
    color: black;
  }
  body.dark .news-item {
    background: #222;
    color: white;
  }
  .news-item a {
    color: var(--blue);
    font-weight: bold;
    text-decoration: none;
  }
  .news-item a:hover {
    text-decoration: underline;
  }
  .error {
    color: red;
  }
</style>
</head>
<body>
<header>
  <h1>Info Dantas Brasil</h1>
  <div id="user-area">
    <form id="login-form" class="login-form">
      <input type="text" id="username" placeholder="Usuário" required />
      <input type="password" id="password" placeholder="Senha" required />
      <button type="submit">Entrar</button>
    </form>
  </div>
  <button id="theme-toggle">🌙</button>
</header>

<main>
  <p id="welcome" style="display:none;"></p>
  <section id="weather-section">
    <h2>Clima</h2>
    <div id="weather-list">Carregando clima...</div>
  </section>

  <section id="news-section" style="display:none;">
    <h2>Notícias</h2>
    <div id="news-list">Carregando notícias...</div>
  </section>
</main>

<script>
  // Configurações
  const NEWS_API_KEY = "92221e88091bab959857e1a937a68fc9";
  const OPENWEATHER_KEY = "d2dbc9154fae0daaf42b27c046652291";

  const CITIES = [
    { name: "São Paulo", lat: -23.55052, lon: -46.633308 },
    { name: "Rio de Janeiro", lat: -22.906847, lon: -43.172896 },
    { name: "Brasília", lat: -15.794229, lon: -47.882166 },
    { name: "Belo Horizonte", lat: -19.916681, lon: -43.934493 },
  ];

  // Tema
  const themeToggleBtn = document.getElementById("theme-toggle");
  function setTheme(theme) {
    if(theme === "dark") {
      document.body.classList.add("dark");
      themeToggleBtn.textContent = "☀️";
      localStorage.setItem("theme", "dark");
    } else {
      document.body.classList.remove("dark");
      themeToggleBtn.textContent = "🌙";
      localStorage.setItem("theme", "light");
    }
  }
  themeToggleBtn.onclick = () => {
    const newTheme = document.body.classList.contains("dark") ? "light" : "dark";
    setTheme(newTheme);
  }
  // Inicializa tema
  setTheme(localStorage.getItem("theme") || "light");

  // Login simulado
  const loginForm = document.getElementById("login-form");
  const userArea = document.getElementById("user-area");
  const welcome = document.getElementById("welcome");
  let currentUser = null;

  function showLoggedIn(user) {
    welcome.style.display = "block";
    welcome.textContent = `Olá, ${user.name}!`;
    loginForm.style.display = "none";
    newsSection.style.display = "block";
  }

  function logout() {
    currentUser = null;
    localStorage.removeItem("user");
    welcome.style.display = "none";
    loginForm.style.display = "flex";
    newsSection.style.display = "none";
  }

  loginForm.addEventListener("submit", e => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    if(username === "admin" && password === "123456") {
      currentUser = { name: "Admin Dantas" };
      localStorage.setItem("user", JSON.stringify(currentUser));
      showLoggedIn(currentUser);
      loadNews();
    } else {
      alert("Credenciais inválidas.");
    }
  });

  // Mantém login na recarga
  window.onload = () => {
    const savedUser = localStorage.getItem("user");
    if(savedUser) {
      currentUser = JSON.parse(savedUser);
      showLoggedIn(currentUser);
      loadNews();
    }
    loadWeather();
  };

  // Clima
  const weatherList = document.getElementById("weather-list");

  async function loadWeather() {
    weatherList.textContent = "Carregando clima...";
    try {
      const results = await Promise.all(CITIES.map(async city => {
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${city.lat}&lon=${city.lon}&units=metric&lang=pt&appid=${OPENWEATHER_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        return { city: city.name, weather: data };
      }));

      weatherList.innerHTML = "";
      results.forEach(({ city, weather }) => {
        if(weather.cod === 200) {
          const icon = `https://openweathermap.org/img/wn/${weather.weather[0].icon}.png`;
          const div = document.createElement("div");
          div.className = "weather-item";
          div.innerHTML = `
            <img src="${icon}" alt="${weather.weather[0].description}" />
            <div>
              <strong>${city}</strong><br/>
              ${Math.round(weather.main.temp)}°C - ${weather.weather[0].description}
            </div>
          `;
          weatherList.appendChild(div);
        }
      });
    } catch(err) {
      weatherList.textContent = "Erro ao carregar clima.";
      console.error(err);
    }
  }

  // Notícias
  const newsSection = document.getElementById("news-section");
  const newsList = document.getElementById("news-list");

  async function loadNews() {
    newsList.textContent = "Carregando notícias...";
    try {
      const url = `https://newsapi.org/v2/top-headlines?language=pt&country=br&apiKey=${NEWS_API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.articles) {
        newsList.innerHTML = "";
        data.articles.slice(0, 10).forEach(article => {
          const div = document.createElement("div");
          div.className = "news-item";
          div.innerHTML = `
            <h3>${article.title}</h3>
            <p>${article.description || ""}</p>
            <a href="${article.url}" target="_blank" rel="noopener noreferrer">Leia mais</a>
          `;
          newsList.appendChild(div);
        });
      } else {
        newsList.textContent = "Nenhuma notícia disponível.";
      }
    } catch(err) {
      newsList.textContent = "Erro ao carregar notícias.";
      console.error(err);
    }
  }
</script>
</body>
</html>
